[workspace]
members = [".", "crates/shelfmd-core"]
resolver = "2"

[package]
name = "shelfmd"
version = "2.0.1"
description = "A beautiful Markdown book reader for Windows"
authors = ["Idawud"]
license = "MIT"
repository = "https://github.com/idawud/ShelfMD"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shelfmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shelfmd-core = { path = "crates/shelfmd-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
notify = "8"
notify-debouncer-mini = "0.6"
once_cell = "1"
dunce = "1"
tantivy = "0.22"
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"
