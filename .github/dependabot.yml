version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # `typescript` must stay on 6 for svelte-check; TS 7 runs via the
      # @typescript/native alias with `svelte-check --tsgo`
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
