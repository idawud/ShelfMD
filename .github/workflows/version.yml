name: Bump Version & Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (print new version without committing)'
        required: false
        type: boolean
        default: false

jobs:
  bump:
    name: Bump version and open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A PAT lets the release PR trigger CI; GITHUB_TOKEN-created PRs don't.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute new version
        id: ver
        shell: bash
        run: |
          current=$(jq -r '.version' package.json)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new"         >> "$GITHUB_OUTPUT"
          echo "tag=v$new"        >> "$GITHUB_OUTPUT"

      - name: Show version change
        run: |
          echo "Bump: ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.new }} (${{ inputs.bump_type }})"
          echo "Tag:  ${{ steps.ver.outputs.tag }}"

      - name: Update package.json
        if: ${{ !inputs.dry_run }}
        run: |
          jq --arg v "${{ steps.ver.outputs.new }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Update src-tauri/Cargo.toml
        if: ${{ !inputs.dry_run }}
        run: |
          # Replace only the first occurrence of version = "..." (the package version)
          sed -i "0,/^version = \"[^\"]*\"/{s/^version = \"[^\"]*\"/version = \"${{ steps.ver.outputs.new }}\"/}" src-tauri/Cargo.toml

      - name: Update src-tauri/tauri.conf.json
        if: ${{ !inputs.dry_run }}
        run: |
          jq --arg v "${{ steps.ver.outputs.new }}" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Verify all three files match
        if: ${{ !inputs.dry_run }}
        run: |
          pkg=$(jq -r '.version' package.json)
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          tauri=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "package.json=$pkg  Cargo.toml=$cargo  tauri.conf.json=$tauri"
          if [ "$pkg" != "${{ steps.ver.outputs.new }}" ] || \
             [ "$cargo" != "${{ steps.ver.outputs.new }}" ] || \
             [ "$tauri" != "${{ steps.ver.outputs.new }}" ]; then
            echo "::error::Version mismatch after update!"
            exit 1
          fi

      - name: Open release PR
        if: ${{ !inputs.dry_run }}
        env:
          # main is protected by a ruleset (PR + code-owner review required), so the
          # bump lands via a PR. tag-release.yml tags the merge commit afterwards.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          branch="release/${{ steps.ver.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore(release): bump version to ${{ steps.ver.outputs.tag }}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): bump version to ${{ steps.ver.outputs.tag }}" \
            --body "Bumps package.json, Cargo.toml and tauri.conf.json from ${{ steps.ver.outputs.current }} to ${{ steps.ver.outputs.new }}. Merging this PR tags \`${{ steps.ver.outputs.tag }}\` and starts the release build."
