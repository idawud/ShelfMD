name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0) — must already exist in the repo'
        required: true
        type: string

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency (tag must match project files)
        shell: pwsh
        run: |
          $tag = ("${{ inputs.tag || github.ref_name }}") -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String 'version = "' src-tauri/Cargo.toml | Select-Object -First 1).Line -replace '.*version = "([^"]+)".*', '$1'
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Write-Host "Tag: $tag | package.json: $pkg | Cargo.toml: $cargo | tauri.conf.json: $tauri"
          if ($tag -ne $pkg -or $pkg -ne $cargo -or $pkg -ne $tauri) {
            Write-Error "Version mismatch! Bump all three files to match the tag."
            exit 1
          }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # MSIX for Microsoft Store — built separately because it may require
      # a Store-issued certificate. Build succeeds unsigned; sign before
      # uploading to Partner Center (see docs/STORE_RELEASE.md).
      - name: Build MSI (MSIX-ready bundle)
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: submit to Microsoft Store via Partner Center API.
      # Configure the four secrets in repo Settings → Secrets before enabling.
      - name: Submit to Microsoft Store
        if: |
          secrets.MS_TENANT_ID != '' &&
          secrets.MS_CLIENT_ID != '' &&
          secrets.MS_CLIENT_SECRET != '' &&
          secrets.MS_SELLER_ID != ''
        run: |
          Write-Host "Store submission — configure after Partner Center setup (see docs/STORE_RELEASE.md)"
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SELLER_ID: ${{ secrets.MS_SELLER_ID }}
