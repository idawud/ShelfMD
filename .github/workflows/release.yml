name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0) — must already exist in the repo'
        required: true
        type: string

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency (tag must match project files)
        shell: pwsh
        run: |
          $tag = ("${{ inputs.tag || github.ref_name }}") -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String 'version = "' src-tauri/Cargo.toml | Select-Object -First 1).Line -replace '.*version = "([^"]+)".*', '$1'
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Write-Host "Tag: $tag | package.json: $pkg | Cargo.toml: $cargo | tauri.conf.json: $tauri"
          if ($tag -ne $pkg -or $pkg -ne $cargo -or $pkg -ne $tauri) {
            Write-Error "Version mismatch! Bump all three files to match the tag."
            exit 1
          }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build MSI installer
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe unsigned/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi unsigned/

      # Code signing via SignPath Foundation (free for OSS). Skipped until the
      # SIGNPATH_ORGANIZATION_ID repo variable is set, so releases still work unsigned.
      # Artifact configuration to paste into SignPath: .github/signpath/artifact-configuration.xml
      - name: Upload unsigned installers
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: unsigned/
          if-no-files-found: error

      - name: Sign installers with SignPath
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: 'https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom'
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ShelfMD' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation release signing needs manual approval in the SignPath UI.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On workflow_dispatch github.ref is the branch, so the action can't infer the tag.
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.sign.outcome == 'success' && 'signed' || 'unsigned' }}/*.exe
            ${{ steps.sign.outcome == 'success' && 'signed' || 'unsigned' }}/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

