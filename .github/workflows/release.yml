name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0) — must already exist in the repo'
        required: true
        type: string

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency (tag must match project files)
        shell: pwsh
        run: |
          $tag = ("${{ inputs.tag || github.ref_name }}") -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String 'version = "' src-tauri/Cargo.toml | Select-Object -First 1).Line -replace '.*version = "([^"]+)".*', '$1'
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Write-Host "Tag: $tag | package.json: $pkg | Cargo.toml: $cargo | tauri.conf.json: $tauri"
          if ($tag -ne $pkg -or $pkg -ne $cargo -or $pkg -ne $tauri) {
            Write-Error "Version mismatch! Bump all three files to match the tag."
            exit 1
          }

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build MSI installer
        run: pnpm tauri build --bundles msi
        env:
          TAURI_SKIP_DEVSERVER_CHECK: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the installers into releases/<tag>/ on main so they can be
      # downloaded straight from the repo tree.
      - name: Commit installers to releases/
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          git fetch origin main
          git checkout -B main origin/main
          $dest = "releases/$tag"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $dest
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $dest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes in $dest — nothing to commit."
            exit 0
          }
          git commit -m "chore(release): add $tag installers [skip ci]"
          git push origin main
